<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 850" width="1200" height="850" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alguard architecture: Tier 1 agent channel and Tier 2 human channel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M1 1 L9 5 L1 9 Z" fill="#8ea3ba"/>
      </marker>
      <marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M1 1 L9 5 L1 9 Z" fill="#e06b67"/>
      </marker>
    </defs>
<style>/* nodes */
.node rect,.node path.shape,.node polygon{fill:#fff;stroke:#cdddef;stroke-width:1.5;}
.node{filter:drop-shadow(0 2px 5px rgba(18,36,54,.08));}
.ok rect{fill:#e4f5ee;stroke:#46a578;}
.warn rect,.warn polygon{fill:#fdf3dc;stroke:#e0a93e;}
.bad rect{fill:#fdeceb;stroke:#e06b67;}
.info rect,.info path.shape{fill:#eef3fb;stroke:#5b7bd6;}
.info path.top{fill:#f7faff;stroke:#5b7bd6;stroke-width:1.5;}
.pur rect{fill:#eeeafa;stroke:#7B5CFA;}

/* text */
.t{font:700 13.5px 'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#122436;text-anchor:middle;}
.s{font:400 10.5px 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5E7690;text-anchor:middle;}
.cap{font:500 10px 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c2453f;text-anchor:middle;}
.ok .t{fill:#17563a;} .warn .t{fill:#5c4400;} .bad .t{fill:#8c2f2b;} .pur .t{fill:#3a2a6e;} .info .t{fill:#24345f;}

/* tiers */
.tier{fill:#f4f8ff;stroke:#d6e2f2;stroke-width:1.5;}
.tier.two{fill:#f6f4ff;stroke:#ddd6f3;}
.tt{font:700 13px 'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#122436;}
.ts{font:400 10.5px 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5E7690;}

/* edges */
.e{fill:none;stroke:#8ea3ba;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.e.red{stroke:#e06b67;}
.flow{stroke-dasharray:5 5;animation:dash 1.1s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-20;}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;}}

/* pills */
.pill{fill:#fff;stroke:#e1eaf4;stroke-width:1;}
.pt{font:500 10.5px 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5E7690;text-anchor:middle;dominant-baseline:central;}
</style>
<rect width="1200" height="850" rx="22" fill="#ffffff"/>

    <!-- ============ TIER PANELS ============ -->
    <rect class="tier" x="30" y="108" width="1140" height="320" rx="22"/>
    <text class="tt" x="50" y="396">TIER 1 — Agent channel</text>
    <text class="ts" x="50" y="412">Alexa+ MCP server · port 8000</text>

    <rect class="tier two" x="30" y="456" width="1140" height="374" rx="22"/>
    <text class="tt" x="50" y="802">TIER 2 — Human channel</text>
    <text class="ts" x="50" y="818">separate service · port 8010</text>

    <!-- ============ EDGES (drawn first, under nodes) ============ -->
    <!-- customer -> alexa -->
    <path class="e" d="M168 76 V156" marker-end="url(#ah)"/>
    <!-- tier 1 pipeline -->
    <path class="e" d="M258 200 H292" marker-end="url(#ah)"/>
    <path class="e" d="M474 200 H508" marker-end="url(#ah)"/>
    <path class="e" d="M690 200 H724" marker-end="url(#ah)"/>
    <path class="e" d="M906 200 H940" marker-end="url(#ah)"/>
    <!-- bedrock -> decision -->
    <path class="e flow" d="M1032 82 V156" marker-end="url(#ah)"/>
    <!-- decision -> log -->
    <path class="e" d="M1032 242 V320" marker-end="url(#ah)"/>
    <!-- decision bus -> outcomes -->
    <path class="e" d="M1032 284 H400 Q384 284 384 300 V320" marker-end="url(#ah)"/>
    <path class="e" d="M1032 284 H616 Q600 284 600 300 V320" marker-end="url(#ah)"/>
    <path class="e red" d="M1032 284 H832 Q816 284 816 300 V320" marker-end="url(#ahr)"/>
    <!-- OK + MONITOR -> receipts -->
    <path class="e" d="M384 394 V426 Q384 442 400 442 H476 Q492 442 492 458 V720" marker-end="url(#ah)"/>
    <path class="e" d="M600 394 V426 Q600 442 584 442 H508 Q492 442 492 458"/>
    <!-- HALTED -> human app (no way back) -->
    <path class="e red flow" d="M816 394 V498" marker-end="url(#ahr)"/>
    <!-- tier 2 chain -->
    <path class="e" d="M816 572 V608" marker-end="url(#ah)"/>
    <path class="e" d="M896 646 H940" marker-end="url(#ah)"/>
    <path class="e" d="M816 682 V720" marker-end="url(#ah)"/>
    <path class="e" d="M716 758 H604" marker-end="url(#ah)"/>
    <path class="e" d="M916 758 H988" marker-end="url(#ah)"/>
    <!-- ledger api -> db -->
    <path class="e flow" d="M1032 610 V398" marker-end="url(#ah)"/>

    <!-- ============ NODES ============ -->
    <!-- Customer -->
    <g class="node">
      <rect x="78" y="20" width="180" height="56" rx="14"/>
      <text class="t" x="168" y="44">Customer</text>
      <text class="s" x="168" y="62">voice or text</text>
    </g>

    <!-- Bedrock -->
    <g class="node pur">
      <rect x="912" y="16" width="240" height="66" rx="14"/>
      <text class="t" x="1032" y="38">Amazon Bedrock</text>
      <text class="s" x="1032" y="55">writes the customer explanation</text>
      <text class="s" x="1032" y="70">deterministic fallback</text>
    </g>

    <!-- Tier 1 pipeline -->
    <g class="node">
      <rect x="78" y="158" width="180" height="84" rx="14"/>
      <text class="t" x="168" y="196">Alexa+</text>
      <text class="s" x="168" y="215">MCP client</text>
    </g>

    <g class="node">
      <rect x="294" y="146" width="180" height="108" rx="14"/>
      <text class="t" x="384" y="172">MCP tools</text>
      <text class="s" x="384" y="191">attempt_purchase</text>
      <text class="s" x="384" y="206">get_session_status</text>
      <text class="s" x="384" y="221">get_audit_trail</text>
      <text class="cap" x="384" y="243">no approve / deny tool</text>
    </g>

    <g class="node">
      <rect x="510" y="158" width="180" height="84" rx="14"/>
      <text class="t" x="600" y="186">Risk engine</text>
      <text class="s" x="600" y="205">category severity</text>
      <text class="s" x="600" y="220">+ anomalies + trust score</text>
    </g>

    <g class="node">
      <rect x="726" y="158" width="180" height="84" rx="14"/>
      <text class="t" x="816" y="186">Owner circuit breaker</text>
      <text class="s" x="816" y="205">an open halt blocks later</text>
      <text class="s" x="816" y="220">non-Low purchases</text>
    </g>

    <g class="node warn">
      <polygon points="960,158 1104,158 1122,200 1104,242 960,242 942,200"/>
      <text class="t" x="1032" y="205">Decision</text>
    </g>

    <!-- Verdicts -->
    <g class="node ok">
      <rect x="299" y="322" width="170" height="72" rx="14"/>
      <text class="t" x="384" y="352">OK</text>
      <text class="s" x="384" y="372">Purchase completes</text>
    </g>

    <g class="node warn">
      <rect x="515" y="322" width="170" height="72" rx="14"/>
      <text class="t" x="600" y="346">MONITOR</text>
      <text class="s" x="600" y="365">Purchase completes,</text>
      <text class="s" x="600" y="380">flagged for review</text>
    </g>

    <g class="node bad">
      <rect x="731" y="322" width="170" height="72" rx="14"/>
      <text class="t" x="816" y="346">HALTED</text>
      <text class="s" x="816" y="365">Purchase NOT completed</text>
      <text class="s" x="816" y="380">action_id returned</text>
    </g>

    <!-- actions_log.db -->
    <g class="node info">
      <path class="shape" d="M932 332 a100 10 0 0 1 200 0 V384 a100 10 0 0 1 -200 0 Z"/>
      <ellipse class="top" cx="1032" cy="332" rx="100" ry="10" style="fill:#f7faff;stroke:#5b7bd6;stroke-width:1.5"/>
      <text class="t" x="1032" y="360">actions_log.db</text>
      <text class="s" x="1032" y="377">SQLite · owned by Tier 1</text>
    </g>

    <!-- Tier 2 -->
    <g class="node">
      <rect x="726" y="500" width="180" height="72" rx="14"/>
      <text class="t" x="816" y="526">Alexa app</text>
      <text class="s" x="816" y="544">account-linked identity</text>
      <text class="s" x="816" y="559">(human only)</text>
    </g>

    <g class="node info">
      <rect x="736" y="610" width="160" height="72" rx="14"/>
      <text class="t" x="816" y="636">Tier2Store</text>
      <text class="s" x="816" y="654">HTTP client</text>
      <text class="s" x="816" y="669">no direct DB access</text>
    </g>

    <g class="node info">
      <rect x="942" y="610" width="180" height="72" rx="14"/>
      <text class="t" x="1032" y="636">Internal ledger API</text>
      <text class="s" x="1032" y="654">port 8015</text>
      <text class="s" x="1032" y="669">Tier 2's only route</text>
    </g>

    <g class="node info">
      <rect x="716" y="722" width="200" height="72" rx="14"/>
      <text class="t" x="816" y="754">resolve_pending_action</text>
      <text class="s" x="816" y="773">APPROVE / DENY</text>
    </g>

    <g class="node info">
      <path class="shape" d="M382 732 a110 10 0 0 1 220 0 V784 a110 10 0 0 1 -220 0 Z"/>
      <ellipse cx="492" cy="732" rx="110" ry="10" style="fill:#f7faff;stroke:#5b7bd6;stroke-width:1.5"/>
      <text class="t" x="492" y="760">Receipts ledger</text>
      <text class="s" x="492" y="777">+ email</text>
    </g>

    <g class="node bad">
      <rect x="990" y="722" width="160" height="72" rx="14"/>
      <text class="t" x="1070" y="754">Purchase</text>
      <text class="t" x="1070" y="772">stays blocked</text>
    </g>

    <!-- ============ EDGE LABELS ============ -->
    <g>
      <rect class="pill" x="88" y="105" width="160" height="22" rx="11"/>
      <text class="pt" x="168" y="116">buy / book / subscribe</text>

      <rect class="pill" x="956" y="109" width="152" height="22" rx="11"/>
      <text class="pt" x="1032" y="120">explains every result</text>

      <rect class="pill" x="704" y="430" width="224" height="24" rx="12"/>
      <text class="pt" x="816" y="442">action_id · no network path back</text>

      <rect class="pill" x="438" y="589" width="108" height="22" rx="11"/>
      <text class="pt" x="492" y="600">receipt issued</text>

      <rect class="pill" x="908" y="464" width="248" height="22" rx="11"/>
      <text class="pt" x="1032" y="475">read-only reads + one atomic resolve</text>

      <rect class="pill" x="898" y="635" width="46" height="22" rx="11"/>
      <text class="pt" x="921" y="646">HTTP</text>

      <rect class="pill" x="624" y="747" width="70" height="22" rx="11"/>
      <text class="pt" x="659" y="758">APPROVED</text>

      <rect class="pill" x="923" y="747" width="58" height="22" rx="11"/>
      <text class="pt" x="952" y="758">DENIED</text>
    </g>
  </svg>